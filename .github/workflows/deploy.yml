name: deploy

# Deploys the Worker to Cloudflare on every push to main. Not the container image: sign-in, /sync and
# Gmail need no container, the servers are on their way out, and the last image built crashes on
# start. `--containers-rollout=none` leaves whatever is deployed alone and builds nothing.
#
# Secrets are set by hand, once, with `npx wrangler secret put <NAME>` (docs/SELF-HOSTING.md), and
# never by CI: this workflow holds only the deploy credentials. `wrangler deploy` keeps the secrets
# already on the Worker.
#
# Repository settings this needs:
#   secrets   CLOUDFLARE_API_TOKEN   start from Cloudflare's "Edit Cloudflare Workers" token template and
#                                    add what `wrangler deploy` reports missing (D1, R2)
#             CLOUDFLARE_ACCOUNT_ID
# Production's vars (PUBLIC_ORIGIN, SIGNUP_MODE, ADMIN_EMAILS...) are the committed
# worker/wrangler.jsonc; the deploy refuses a PUBLIC_ORIGIN there that is not a public https origin
# (`wrangler dev` takes the local one from worker/.dev.vars), and checks it afterwards.
# Without CLOUDFLARE_API_TOKEN the deploy job is skipped (forks, and installs that deploy by hand).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip without deploy credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; not deploying"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      # Email Routing rules name the Worker; a rename would silently stop mail delivery.
      - name: The Worker is still called leanmail
        run: |
          grep -q '"name": "leanmail"' worker/wrangler.jsonc

      # The committed vars are production's: one PUBLIC_ORIGIN, https, on a public host name.
      - name: wrangler.jsonc names a public https PUBLIC_ORIGIN
        if: steps.creds.outputs.go == 'true'
        run: |
          origins=$(grep -oE '"PUBLIC_ORIGIN"[[:space:]]*:[[:space:]]*"[^"]*"' worker/wrangler.jsonc | sed -E 's/.*:[[:space:]]*"([^"]*)"$/\1/')
          if [ "$(printf '%s\n' "$origins" | grep -c .)" != "1" ]; then
            echo "worker/wrangler.jsonc must set vars.PUBLIC_ORIGIN exactly once (found: $origins)"; exit 1
          fi
          origin="$origins"
          if ! printf '%s' "$origin" | grep -Eq '^https://([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,63}(:[0-9]{1,5})?$'; then
            echo "vars.PUBLIC_ORIGIN must be an https origin on a public host name, no path or trailing slash (got: $origin)"; exit 1
          fi
          if printf '%s' "$origin" | grep -Eq '^https://(localhost|([^/]*\.)?(localhost|local|test|example|invalid|internal))(:[0-9]+)?$'; then
            echo "vars.PUBLIC_ORIGIN is a local or reserved name (got: $origin)"; exit 1
          fi
          echo "PUBLIC_ORIGIN=$origin" >> "$GITHUB_ENV"

      # A placeholder database_id means `wrangler d1 create` was never wired in.
      - name: wrangler.jsonc names a real D1 database
        if: steps.creds.outputs.go == 'true'
        run: |
          if grep -q '"database_id": "00000000-0000-0000-0000-000000000000"' worker/wrangler.jsonc; then
            echo "set database_id in worker/wrangler.jsonc (npx wrangler d1 create leanmail-ctl)"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - working-directory: worker
        run: npm ci
      - working-directory: worker
        run: npm run typecheck
      - working-directory: worker
        run: npm test

      - name: Apply D1 migrations
        if: steps.creds.outputs.go == 'true'
        working-directory: worker
        run: npx wrangler d1 migrations apply leanmail-ctl --remote

      - name: Deploy
        if: steps.creds.outputs.go == 'true'
        working-directory: worker
        run: npx wrangler deploy --containers-rollout=none

      - name: Health check
        if: steps.creds.outputs.go == 'true'
        run: |
          for i in $(seq 1 30); do
            if curl -sf "$PUBLIC_ORIGIN/health"; then echo; exit 0; fi
            sleep 5
          done
          echo "$PUBLIC_ORIGIN/health did not answer"; exit 1

      # /health is the Worker alone. A bad address reaches /auth/login's rate limit and so D1, and is
      # refused before anything is mailed, so this signs nobody in and bothers nobody.
      - name: Sign-in answers
        if: steps.creds.outputs.go == 'true'
        run: |
          code=$(curl -s -o /dev/null -m 30 -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"email":"x"}' "$PUBLIC_ORIGIN/auth/login" || true)
          echo "/auth/login $code"
          if [ "$code" != "400" ]; then echo "$PUBLIC_ORIGIN/auth/login did not answer as expected"; exit 1; fi
