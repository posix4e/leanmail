name: deploy

# Deploys the Worker and the container image to Cloudflare on every push to main.
#
# Secrets are set by hand, once, with `npx wrangler secret put <NAME>` (docs/SELF-HOSTING.md), and
# never by CI: this workflow holds only the deploy credentials. `wrangler deploy` keeps the secrets
# already on the Worker.
#
# Repository settings this needs:
#   secrets   CLOUDFLARE_API_TOKEN   start from Cloudflare's "Edit Cloudflare Workers" token template and
#                                    add what `wrangler deploy` reports missing (D1, R2, Containers)
#             CLOUDFLARE_ACCOUNT_ID
#   variables PUBLIC_ORIGIN          e.g. https://mail.example.com, checked after the deploy
# Without CLOUDFLARE_API_TOKEN the deploy job is skipped (forks, and installs that deploy by hand).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip without deploy credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; not deploying"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      # Email Routing rules name the Worker; a rename would silently stop mail delivery.
      - name: The Worker is still called leanmail
        run: |
          grep -q '"name": "leanmail"' worker/wrangler.jsonc

      # A placeholder database_id means `wrangler d1 create` was never wired in.
      - name: wrangler.jsonc names a real D1 database
        if: steps.creds.outputs.go == 'true'
        run: |
          if grep -q '"database_id": "00000000-0000-0000-0000-000000000000"' worker/wrangler.jsonc; then
            echo "set database_id in worker/wrangler.jsonc (npx wrangler d1 create leanmail-ctl)"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - working-directory: worker
        run: npm ci
      - working-directory: worker
        run: npm run typecheck
      - working-directory: worker
        run: npm test

      # The Linux Lean toolchain and Litestream tarballs the image build COPYs (server/.cache).
      - name: Cache the image's toolchain tarballs
        if: steps.creds.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: server/.cache
          key: toolchain-${{ hashFiles('lean/lean-toolchain', 'Makefile') }}
      - name: Fetch the toolchain tarballs
        if: steps.creds.outputs.go == 'true'
        run: make toolchain-cache

      - name: Apply D1 migrations
        if: steps.creds.outputs.go == 'true'
        working-directory: worker
        run: npx wrangler d1 migrations apply leanmail-ctl --remote

      # Builds server/Dockerfile (linux/amd64; native on this runner), pushes it to Cloudflare's
      # registry and rolls the Worker and its containers.
      - name: Deploy
        if: steps.creds.outputs.go == 'true'
        working-directory: worker
        run: npx wrangler deploy

      - name: Health check
        if: steps.creds.outputs.go == 'true' && env.PUBLIC_ORIGIN != ''
        run: |
          for i in $(seq 1 30); do
            if curl -sf "$PUBLIC_ORIGIN/health"; then echo; exit 0; fi
            sleep 5
          done
          echo "$PUBLIC_ORIGIN/health did not answer"; exit 1
