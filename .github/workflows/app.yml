name: app

# The native app (app/, LeanNative): Lean build and proof gate, the app's selftest, iOS simulator builds,
# and the UI tests against a bare leanmail-server holding the fixture mail (app/ios/ui-before).
on:
  push:
    branches: [main]
    paths: ['app/**', 'lean/Core/**', 'lean/Core.lean', 'lean/lakefile.lean', 'lean/lean-toolchain', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', 'lean/Core/**', 'lean/Core.lean', 'lean/lakefile.lean', 'lean/lean-toolchain', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    uses: LeanNative/leannative/.github/workflows/ios-app.yml@eb8428cf555d9e7b4e71dbe20a495545859d341e
    with:
      leannative: eb8428cf555d9e7b4e71dbe20a495545859d341e
      lean-packages: lean app
      build-targets: |
        app leanmail-app-cli
      app-dir: app
      app-root: LeanMailApp
      scheme: LeanMailApp
      tests: |
        app .lake/build/bin/leanmail-app-cli selftest
      # relative to the checkout: `github.workspace` is empty where a reusable workflow's `with:` is read
      ui-before: app/ios/ui-before
      ui-after: app/ios/ui-after
