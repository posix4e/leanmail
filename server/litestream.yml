# Litestream: the account's SQLite file, streamed to R2 under db/<account id>/.
# Credentials come from LITESTREAM_ACCESS_KEY_ID / LITESTREAM_SECRET_ACCESS_KEY (set by entrypoint.sh).
logging:
  level: info
  type: json
# A restore holds one open R2 stream per file in its plan, so a long plan fails. Hourly snapshots
# keep the plan to an hour of files, even when compaction has stalled.
snapshot:
  interval: 1h
  retention: 168h
dbs:
  - path: ${DATA_DIR}/mail.db
    replica:
      type: s3
      bucket: ${R2_BUCKET}
      path: db/${ACCOUNT_ID}
      endpoint: ${R2_ENDPOINT}
      region: auto
      force-path-style: true
      sync-interval: 1s
